[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/cli",
    "crates/tui",
]

[workspace.dependencies]
ratatui = "0.28"
crossterm = "0.28"
reqwest = "0.12"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
chrono = "0.4"

[workspace.package]
version = "0.2.5"
edition = "2021"
license = "MIT"
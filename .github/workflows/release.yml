name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Build release
      run: cargo build --release

    - name: Upload binary to release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ${{ matrix.os == 'windows-latest' && format('target/release/mirror-{0}.exe', matrix.os) || format('target/release/mirror-{0}', matrix.os) }}
        fail_on_unmatched_files: true
